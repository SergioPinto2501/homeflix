<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeFlix</title>
<style>
:root{--bg:#0e0e10;--panel:#181a1d;--text:#f2f0ea;--dim:#a7a7ab;--red:#e03a3e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:1.4rem;padding:.9rem 4%;background:linear-gradient(#000c,#0000);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{font:900 1.7rem/1 "Arial Narrow","Helvetica Neue",Arial,sans-serif;letter-spacing:.02em;color:var(--red)}
.tabs{display:flex;gap:1.2rem}
.tabs button{color:var(--dim);font-size:.95rem}.tabs button.on,.tabs button:hover{color:#fff}
.sp{flex:1}
#q{background:#000a;border:1px solid #fff6;border-radius:4px;color:#fff;padding:.4rem .7rem;width:min(14rem,36vw);font:inherit}
#scan{color:var(--dim);font-size:.9rem}#scan:hover{color:#fff}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.5rem;border-radius:4px;font-weight:700;font-size:1.05rem}
.btn.w{background:#fff;color:#000}.btn.w:hover{background:#ffffffc0}
.btn.g{background:#6d6d6eb3;color:#fff}.btn.g:hover{background:#6d6d6e66}
.hero{position:relative;height:min(80vh,740px);display:flex;align-items:flex-end;padding:0 4% 8%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,#0000 62%),linear-gradient(#0000 55%,var(--bg))}
.hero>div{position:relative;z-index:1;max-width:36rem}
.hero h1{font-size:clamp(2rem,5vw,3.8rem);margin:0 0 .6rem;line-height:1.05;text-shadow:0 2px 12px #000a}
.hero p{margin:0 0 1.2rem;color:#e8e8e8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px #000a}
.hero .acts{display:flex;gap:.7rem;flex-wrap:wrap}
main{margin-top:-5rem;position:relative;z-index:2;padding-bottom:4rem}
main.pad{margin-top:5.5rem}
.row{margin:0 0 1.2rem}
.row h2{font-size:1.25rem;margin:0 4% .2rem}
.rw{position:relative}
.track{display:flex;gap:.5rem;overflow-x:auto;padding:.8rem 4% 1.4rem;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:0;bottom:1.4rem;width:4%;z-index:3;background:#000a;font-size:2rem;opacity:0;transition:opacity .2s}
.rw:hover .arrow{opacity:1}.arrow.l{left:0}.arrow.r{right:0}
.card{flex:0 0 auto;width:clamp(120px,14vw,190px);aspect-ratio:2/3;border-radius:4px;position:relative;overflow:hidden;scroll-snap-align:start;transition:transform .2s;text-align:left}
.card.wide{width:clamp(210px,24vw,330px);aspect-ratio:16/9}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:4}
.lbl{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .6rem .5rem;background:linear-gradient(#0000,#000d);font-weight:600;font-size:.9rem}
.nm{position:absolute;inset:0;display:grid;place-items:center;padding:.8rem;text-align:center;font-weight:700;font-size:1.05rem;text-shadow:0 1px 4px #0008}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#fff4}.pb i{display:block;height:100%;background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem .6rem;padding:0 4%}
.grid .card{width:auto}
.empty{padding:6rem 4%;color:var(--dim);text-align:center}
#modal{position:fixed;inset:0;z-index:30;background:#000c;overflow:auto;padding:2rem 1rem;display:none}
#modal.on{display:block}
.sheet{max-width:880px;margin:0 auto;background:var(--panel);border-radius:8px;overflow:hidden;position:relative}
.ban{height:min(46vw,400px);display:flex;align-items:flex-end;padding:1.5rem 2rem;position:relative}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,var(--panel))}
.ban>*{position:relative;z-index:1}
.ban h2{margin:0 0 .8rem;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.1;text-shadow:0 2px 10px #000a}
.x{position:absolute;top:.8rem;right:.8rem;z-index:2;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--bg);font-size:1.1rem}
.body{padding:0 2rem 2rem}
.meta{color:var(--dim);margin:0 0 .8rem}
.body p{max-width:65ch;margin:0 0 1.2rem}
.sh{display:flex;justify-content:space-between;align-items:center;margin:1.2rem 0 .4rem}
.sh b{font-size:1.2rem}
select{background:var(--bg);color:inherit;border:1px solid #fff4;border-radius:4px;padding:.4rem .6rem;font:inherit}
.ep{display:grid;grid-template-columns:2.5rem 1fr;gap:.3rem 1rem;align-items:center;width:100%;padding:.9rem .6rem;border-bottom:1px solid #fff1;text-align:left;position:relative}
.ep:hover{background:#ffffff12}
.ep b{font-size:1.4rem;color:var(--dim);text-align:center;grid-row:span 2}
.ep .pb{position:static;grid-column:2;border-radius:2px}
#player{position:fixed;inset:0;z-index:40;background:#000;display:none}
#player.on{display:block}
#vid{width:100%;height:100%;background:#000}
.pbar{position:absolute;top:0;left:0;right:0;padding:1rem 1.5rem;display:flex;gap:1rem;align-items:center;background:linear-gradient(#000a,#0000);transition:opacity .3s;pointer-events:none}
.pbar button{pointer-events:auto;font-size:1.6rem}
#player.idle .pbar{opacity:0}#player.idle{cursor:none}
@media(max-width:640px){nav{gap:.8rem}.logo{font-size:1.3rem}.tabs{gap:.8rem}.body,.ban{padding-left:1rem;padding-right:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav id="nav">
  <span class="logo">HOMEFLIX</span>
  <div class="tabs">
    <button class="on" data-v="home">Home</button>
    <button data-v="series">Serie TV</button>
    <button data-v="movie">Film</button>
  </div>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="Cerca" aria-label="Cerca">
  <button id="scan" title="Cerca nuovi file nella cartella media">Aggiorna</button>
</nav>
<header class="hero" id="hero" hidden><div>
  <h1 id="hT"></h1><p id="hP"></p>
  <div class="acts"><button class="btn w" id="hPlay">▶ Riproduci</button><button class="btn g" id="hInfo">Altre info</button></div>
</div></header>
<main id="main"></main>
<div id="modal" aria-modal="true" role="dialog"></div>
<div id="player">
  <video id="vid" controls playsinline></video>
  <div class="pbar"><button id="back" aria-label="Indietro">←</button><span id="pT"></span></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const j = (u, o) => fetch(u, o).then((r) => r.json());
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const grad = (t) => { const h = [...t.name].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7), a = Math.abs(h) % 360;
  return `linear-gradient(160deg,hsl(${a} 40% 30%),hsl(${(a + 50) % 360} 45% 12%))`; };
const posterBg = (t) => (t.poster ? `url("${t.poster}") center/cover` : grad(t));
const wideBg = (t) => (t.backdrop ? `url("${t.backdrop}") center 20%/cover` : t.poster ? `${grad(t)}` : grad(t));
const tag = (f) => (f && f.season != null ? `S${f.season} E${f.episode}` : '');

let titles = [], cont = [], view = 'home', q = '', heroId = null, cur = null, curFile = null, lastSave = 0;

async function load() { [titles, cont] = await Promise.all([j('/api/titles'), j('/api/continue')]); render(); }

function card(t, o = {}) {
  const b = document.createElement('button');
  b.className = 'card' + (o.wide ? ' wide' : '');
  b.style.background = o.wide ? wideBg(t) : posterBg(t);
  const pct = o.f && o.f.duration ? Math.round((o.f.position / o.f.duration) * 100) : 0;
  b.innerHTML = (o.wide ? (t.backdrop ? '' : `<span class="nm">${esc(t.name)}</span>`) + `<span class="lbl">${esc(t.name)}${o.f && tag(o.f) ? ' · ' + tag(o.f) : ''}</span>`
      : t.poster ? '' : `<span class="nm">${esc(t.name)}</span>`)
    + (pct ? `<span class="pb"><i style="width:${pct}%"></i></span>` : '');
  b.setAttribute('aria-label', t.name);
  b.onclick = () => openTitle(t.id, o.f && o.f.file_id, !!o.f);
  return b;
}

function row(name, items) {
  if (!items.length) return null;
  const s = document.createElement('section');
  s.className = 'row';
  s.innerHTML = `<h2>${esc(name)}</h2><div class="rw"><button class="arrow l" aria-label="Indietro">‹</button><div class="track"></div><button class="arrow r" aria-label="Avanti">›</button></div>`;
  const tr = s.querySelector('.track');
  tr.append(...items);
  s.querySelector('.l').onclick = () => tr.scrollBy({ left: -tr.clientWidth * 0.8, behavior: 'smooth' });
  s.querySelector('.r').onclick = () => tr.scrollBy({ left: tr.clientWidth * 0.8, behavior: 'smooth' });
  return s;
}

function drawHero() {
  const c = cont[0];
  let t = c ? titles.find((x) => x.id === c.title_id) : titles.find((x) => x.id === heroId);
  if (!t) { t = titles[Math.floor(Math.random() * titles.length)]; heroId = t.id; }
  $('#hero').style.background = wideBg(t);
  $('#hT').textContent = t.name;
  $('#hP').textContent = t.overview || (t.kind === 'series' ? 'Serie TV' : 'Film') + (t.year ? ` · ${t.year}` : '');
  $('#hPlay').textContent = c ? '▶ Riprendi' : '▶ Riproduci';
  $('#hPlay').onclick = () => openTitle(t.id, c && c.file_id, true);
  $('#hInfo').onclick = () => openTitle(t.id);
}

function render() {
  const main = $('#main'), hero = $('#hero');
  main.replaceChildren();
  const list = q ? titles.filter((t) => t.name.toLowerCase().includes(q))
    : view === 'movie' ? titles.filter((t) => t.kind === 'movie')
    : view === 'series' ? titles.filter((t) => t.kind === 'series') : null;
  const bare = !!list || !titles.length;
  hero.hidden = bare; main.classList.toggle('pad', bare); onScroll();
  if (!titles.length) { main.innerHTML = '<div class="empty">La libreria è vuota. Copia i video nella cartella <code>media/</code> e premi “Aggiorna”.</div>'; return; }
  if (list) {
    if (!list.length) main.innerHTML = '<div class="empty">Nessun risultato.</div>';
    else { const g = document.createElement('div'); g.className = 'grid'; g.append(...list.map((t) => card(t))); main.append(g); }
    return;
  }
  drawHero();
  const recent = [...titles].sort((a, b) => b.id - a.id).slice(0, 20);
  main.append(...[
    row('Continua a guardare', cont.map((f) => card({ id: f.title_id, name: f.name, poster: f.poster, backdrop: f.backdrop }, { wide: 1, f }))),
    row('Aggiunti di recente', recent.map((t) => card(t))),
    row('Film', titles.filter((t) => t.kind === 'movie').map((t) => card(t))),
    row('Serie TV', titles.filter((t) => t.kind === 'series').map((t) => card(t))),
  ].filter(Boolean));
}

async function openTitle(id, fileId, auto) {
  const t = await j('/api/titles/' + id);
  cur = t;
  const resume = t.files.find((f) => f.id == fileId) || t.files.find((f) => f.position > 10 && f.position < f.duration - 30) || t.files[0];
  const seasons = [...new Set(t.files.map((f) => f.season))];
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><button class="x" aria-label="Chiudi">✕</button>
    <div class="ban"><div><h2>${esc(t.name)}</h2>${resume ? `<button class="btn w" id="pl">▶ ${resume.position > 10 ? 'Riprendi' : 'Riproduci'}${tag(resume) ? ' ' + tag(resume) : ''}</button>` : ''}</div></div>
    <div class="body"><p class="meta">${t.kind === 'series' ? `Serie TV · ${seasons.length} stagion${seasons.length === 1 ? 'e' : 'i'} · ${t.files.length} episodi` : 'Film' + (t.year ? ` · ${t.year}` : '')}</p>
    ${t.overview ? `<p>${esc(t.overview)}</p>` : ''}
    ${t.kind === 'series' ? `<div class="sh"><b>Episodi</b><select id="sel">${seasons.map((s) => `<option value="${s}">Stagione ${s}</option>`).join('')}</select></div><div id="eps"></div>` : ''}</div></div>`;
  m.querySelector('.ban').style.background = wideBg(t);
  m.querySelector('.x').onclick = closeModal;
  if (resume) m.querySelector('#pl').onclick = () => play(resume.id);
  if (t.kind === 'series') {
    const sel = $('#sel'), draw = () => {
      $('#eps').replaceChildren(...t.files.filter((f) => f.season == sel.value).map((f) => {
        const b = document.createElement('button'); b.className = 'ep';
        const pct = f.duration ? Math.round((f.position / f.duration) * 100) : 0;
        b.innerHTML = `<b>${f.episode}</b><span>Episodio ${f.episode}</span>${pct ? `<span class="pb"><i style="width:${pct}%"></i></span>` : ''}`;
        b.onclick = () => play(f.id);
        return b;
      }));
    };
    sel.value = resume ? resume.season : seasons[0]; sel.onchange = draw; draw();
  }
  m.classList.add('on'); m.scrollTop = 0; document.body.style.overflow = 'hidden';
  if (auto && resume) play(resume.id);
}
function closeModal() { $('#modal').classList.remove('on'); document.body.style.overflow = ''; }
$('#modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };

function play(id) {
  const f = cur.files.find((x) => x.id == id), v = $('#vid');
  curFile = f;
  v.src = '/stream/' + f.id;
  v.onloadedmetadata = () => { if (f.position > 10 && f.position < v.duration - 30) v.currentTime = f.position; };
  $('#pT').textContent = cur.name + (tag(f) ? ' · ' + tag(f) : '');
  $('#player').classList.add('on');
  v.play().catch(() => {});
  poke();
}
function save(force) {
  const v = $('#vid');
  if (!curFile || !v.duration || (!force && Date.now() - lastSave < 5000)) return;
  lastSave = Date.now();
  curFile.position = v.currentTime; curFile.duration = v.duration;
  fetch('/api/progress/' + curFile.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ position: v.currentTime, duration: v.duration }), keepalive: true });
}
function closePlayer() {
  save(true);
  const v = $('#vid'); v.pause(); v.removeAttribute('src'); v.load();
  $('#player').classList.remove('on');
  if (document.fullscreenElement) document.exitFullscreen();
  curFile = null; closeModal(); load();
}
$('#vid').ontimeupdate = () => save(false);
$('#vid').onpause = () => save(true);
$('#vid').onended = () => {
  save(true);
  const fs = cur.files, i = fs.indexOf(curFile);
  if (fs[i + 1]) { fs[i + 1].position = 0; play(fs[i + 1].id); } else closePlayer();
};
$('#back').onclick = closePlayer;
let idleT;
function poke() { const p = $('#player'); p.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!$('#vid').paused) p.classList.add('idle'); }, 3000); }
$('#player').onmousemove = poke;

document.addEventListener('keydown', (e) => {
  const v = $('#vid');
  if ($('#player').classList.contains('on')) {
    if (e.key === 'Escape') closePlayer();
    else if (e.key === 'ArrowRight') v.currentTime += 10;
    else if (e.key === 'ArrowLeft') v.currentTime -= 10;
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : $('#player').requestFullscreen();
    else if (e.key === ' ' && e.target !== v) { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    poke();
  } else if (e.key === 'Escape') closeModal();
});

document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  view = b.dataset.v; q = ''; $('#q').value = '';
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  render(); scrollTo(0, 0);
}));
let tm; $('#q').oninput = (e) => { clearTimeout(tm); tm = setTimeout(() => { q = e.target.value.trim().toLowerCase(); render(); }, 150); };
function onScroll() { $('#nav').classList.toggle('solid', scrollY > 40 || $('#hero').hidden); }
addEventListener('scroll', onScroll);
$('#scan').onclick = async () => {
  const b = $('#scan'); b.disabled = true; b.textContent = 'Scansione…';
  const r = await j('/api/scan', { method: 'POST' });
  b.disabled = false; b.textContent = r.error ? 'Errore' : `${r.titles} titoli`;
  setTimeout(() => (b.textContent = 'Aggiorna'), 2500);
  load();
};
load();
</script>
</body>
</html>
