<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>HomeFlix</title>
<style>
:root{--bg:#141414;--panel:#181818;--dim:#b3b3b3;--red:#e50914;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:#fff;font:16px/1.45 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.i{width:1.5em;height:1.5em;fill:currentColor;vertical-align:middle;flex:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.disp{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.03em}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:1.6rem;padding:calc(.8rem + var(--st)) 4% .8rem;background:linear-gradient(#000d,#0000);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{font-size:1.9rem;line-height:1;color:var(--red);font-weight:900}
.tabs{display:flex;gap:1.3rem}
.tabs button{color:#e5e5e5;font-size:.92rem}.tabs button.on{font-weight:700;color:#fff}.tabs button:hover{color:var(--dim)}
.sp{flex:1}
.sbox{display:flex;align-items:center;gap:.2rem;padding:.2rem .4rem;border:1px solid transparent}
.sbox.open{border-color:#fff;background:#000a}
.sbox input{width:0;padding:0;border:0;background:none;color:#fff;font:inherit;outline:0;transition:width .25s}
.sbox.open input{width:min(14rem,40vw);padding:.2rem .4rem}
#scan{display:flex;align-items:center;gap:.4rem;color:var(--dim);font-size:.9rem}#scan:hover{color:#fff}
.bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:25;justify-content:space-around;background:#0b0b0bf5;border-top:1px solid #ffffff14;padding:.3rem 0 calc(.3rem + var(--sb))}
.bar button{display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.68rem;color:var(--dim);flex:1;min-width:0;padding:.35rem}
.bar button.on{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.55rem 1.5rem;border-radius:4px;font-weight:700;font-size:1.05rem;min-height:2.75rem}
.btn.w{background:#fff;color:#000}.btn.w:hover{background:#ffffffbf}
.btn.g{background:#6d6d6eb3}.btn.g:hover{background:#6d6d6e66}
.hero{position:relative;height:min(82vh,760px);display:flex;align-items:flex-end;padding:0 4% 9%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,#0000 62%),linear-gradient(#0000 55%,var(--bg))}
.hero>div{position:relative;z-index:1;max-width:34rem}
.hk{letter-spacing:.3em;font-size:.72rem;color:#ddd;font-weight:700;margin:0 0 .4rem}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);line-height:.95;margin:0 0 .8rem;font-weight:900;text-shadow:0 2px 14px #000a}
.hero p{margin:0 0 1.2rem;color:#e8e8e8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px #000a}
.acts{display:flex;gap:.7rem}
main{margin-top:-5rem;position:relative;z-index:2;padding-bottom:4rem}
main.pad{margin-top:5.5rem}
.row{margin:0 0 1rem}
.row h2{font-size:1.3rem;margin:0 4%;font-weight:700}
.rw{position:relative}
.track{display:flex;gap:.45rem;overflow-x:auto;padding:.8rem 4% 1.4rem;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:.8rem;bottom:1.4rem;width:4%;z-index:3;background:#000a;font-size:2.2rem;opacity:0;transition:opacity .2s}
.rw:hover .arrow{opacity:1}.arrow.l{left:0}.arrow.r{right:0}
.card{flex:0 0 auto;width:clamp(105px,14vw,190px);aspect-ratio:2/3;border-radius:4px;position:relative;overflow:hidden;scroll-snap-align:start;transition:transform .2s,box-shadow .2s;text-align:left}
.card.wide{width:clamp(200px,24vw,330px);aspect-ratio:16/9}
.card:hover,.card:focus-visible{transform:scale(1.08);z-index:4;box-shadow:0 8px 24px #000c}
.lbl{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .6rem .5rem;background:linear-gradient(#0000,#000e);font-weight:700;font-size:.9rem}
.hov{opacity:0;transition:opacity .2s}.card:hover .hov,.card:focus-visible .hov{opacity:1}
.nm{position:absolute;inset:0;display:grid;place-items:center;padding:.8rem;text-align:center;font-weight:700;font-size:1.05rem;text-shadow:0 1px 4px #0008}
.pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2.8rem;height:2.8rem;display:grid;place-items:center;border:2px solid #fff;border-radius:50%;background:#0008}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#fff4}.pb i{display:block;height:100%;background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem .5rem;padding:0 4%}
.grid .card{width:auto}
.empty{padding:6rem 4%;color:var(--dim);text-align:center}
#mq{display:block;width:calc(100% - 8%);margin:0 4% 1.2rem;padding:.8rem 1rem;border-radius:6px;border:0;background:#333;color:#fff;font:inherit;font-size:1rem;outline:0}
#modal{position:fixed;inset:0;z-index:30;background:#000b;overflow:auto;overscroll-behavior:contain;padding:2rem 1rem;display:none}
#modal.on{display:block}
.sheet{max-width:900px;margin:0 auto;background:var(--panel);border-radius:8px;overflow:hidden;position:relative;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.ban{height:min(50vw,440px);display:flex;align-items:flex-end;padding:1.5rem 2.2rem;position:relative}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 40%,var(--panel))}
.ban>*{position:relative;z-index:1}
.ban h2{margin:0 0 .9rem;font-size:clamp(2rem,5vw,3.2rem);line-height:1;font-weight:900;text-shadow:0 2px 12px #000a}
.x{position:absolute;top:calc(.8rem + var(--st));right:.8rem;z-index:3;width:2.6rem;height:2.6rem;border-radius:50%;background:#181818e6;display:grid;place-items:center}
.body{padding:0 2.2rem 2rem}
.meta{margin:0 0 .8rem;color:var(--dim)}.meta b{color:#46d369}
.body p{max-width:65ch;margin:0 0 1.2rem}
.sh{display:flex;justify-content:space-between;align-items:center;margin:1.4rem 0 .4rem}.sh b{font-size:1.3rem}
select{background:#242424;color:inherit;border:1px solid #fff4;border-radius:4px;padding:.55rem .8rem;font:inherit}
.ep{display:grid;grid-template-columns:2.6rem 1fr 2rem;gap:.3rem 1rem;align-items:center;width:100%;padding:1rem .6rem;border-bottom:1px solid #fff1;text-align:left;min-height:3.5rem}
.ep:hover{background:#ffffff14}
.ep b{font-size:1.5rem;color:var(--dim);text-align:center;grid-row:span 2}
.ep .ic{grid-row:span 2;opacity:.7}
.ep .pb{position:static;grid-column:2;border-radius:2px}
#player{position:fixed;inset:0;z-index:40;background:#000;display:none;touch-action:manipulation}
#player.on{display:block}
#vid{width:100%;height:100%;object-fit:contain;background:#000}
.pui{position:absolute;inset:0;pointer-events:none;transition:opacity .25s}
.pui button,.pui input{pointer-events:auto}
.pui::before,.pui::after{content:"";position:absolute;left:0;right:0;height:9rem}
.pui::before{top:0;background:linear-gradient(#000b,#0000)}.pui::after{bottom:0;background:linear-gradient(#0000,#000c)}
#player.idle .pui{opacity:0}#player.idle .pui button,#player.idle .pui input{pointer-events:none}#player.idle{cursor:none}
.ptop{position:absolute;top:0;left:0;right:0;z-index:1;display:flex;align-items:center;gap:1rem;padding:calc(1rem + var(--st)) calc(1.5rem + var(--sr)) 0 calc(1rem + var(--sl))}
.ptop button{width:2.8rem;height:2.8rem;display:grid;place-items:center}
.pmid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;display:flex;align-items:center;gap:clamp(1.5rem,8vw,4.5rem)}
.pmid button{width:3.4rem;height:3.4rem;display:grid;place-items:center}.pmid .i{width:2.6rem;height:2.6rem}
.pmid #pp{width:4.6rem;height:4.6rem;border-radius:50%;background:#0007}.pmid #pp .i{width:3rem;height:3rem}
.pbot{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 calc(1.5rem + var(--sr)) calc(.8rem + var(--sb)) calc(1.5rem + var(--sl))}
.sk{display:flex;align-items:center;gap:.8rem}
#seek{flex:1;accent-color:var(--red);height:1.8rem;cursor:pointer}
.tm{font-size:.85rem;font-variant-numeric:tabular-nums;color:#ddd;min-width:3.2rem;text-align:center}
.pr{display:flex;justify-content:space-between;align-items:center}
.pr>div{display:flex;align-items:center;gap:.4rem}
.pr button{display:flex;align-items:center;gap:.4rem;padding:.5rem;min-height:2.75rem}
#vol{width:6rem;accent-color:#fff}
#sfb{position:absolute;top:40%;background:#000a;padding:.5rem 1rem;border-radius:2rem;opacity:0;transition:opacity .2s;pointer-events:none;transform:translateX(-50%)}
#sfb.show{opacity:1}
.pg{padding:0 4%;max-width:900px}.ph{font-size:1.7rem;margin:0 0 .4rem}
.hint{color:var(--dim);font-size:.9rem;margin:0 0 1rem}
.box{background:#1f1f1f;border-radius:8px;padding:1rem;margin:0 0 1.2rem}.box h3{margin:0 0 .6rem}
.inp,.box select{width:100%;padding:.7rem .9rem;border-radius:6px;border:0;background:#333;color:#fff;font:inherit;outline:0;margin-bottom:.6rem}
.li{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid #ffffff14}
.li img{width:46px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;background:#333;flex:none}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--dim)}
.btn.s{padding:.3rem .9rem;font-size:.9rem;min-height:2.2rem}
.tag{display:inline-block;background:#46d36933;color:#46d369;border-radius:3px;padding:0 .4rem;font-size:.75rem;margin-left:.4rem}
.prov{margin-top:.4rem;font-size:.85rem;color:var(--dim)}.prov img{width:28px;height:28px;border-radius:6px;margin:.2rem .3rem 0 0;vertical-align:middle}
.st{font-size:.8rem;padding:.1rem .5rem;border-radius:3px;background:#333;white-space:nowrap}.st.ok{background:#46d36933;color:#46d369}.st.er{background:#e5091433;color:#ff6b6b}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 4% .8rem}
.chip{padding:.35rem .95rem;border-radius:2rem;background:#2b2b2b;font-size:.9rem}.chip:hover{background:#3a3a3a}.chip.on{background:#fff;color:#000;font-weight:700}
.pg.wide{max-width:none;padding:0}.pg.wide>.ph{margin:0 4% .8rem}.pg.wide .pg{padding:0 4%}
@keyframes fade{from{opacity:0}}@keyframes up2{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes shim{to{background-position:-200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}}@keyframes pop2{50%{transform:scale(1.25)}}
.view{animation:up2 .4s ease-out}
.card.pop{animation:pop .5s backwards}
.row.rv{opacity:0;transform:translateY(26px);transition:opacity .6s,transform .6s}.row.rv.in{opacity:1;transform:none}
.hero.go{animation:fade .8s}.hero.go .hk,.hero.go h1,.hero.go p,.hero.go .acts{animation:up2 .7s backwards}
.hero.go h1{animation-delay:.1s}.hero.go p{animation-delay:.2s}.hero.go .acts{animation-delay:.3s}
.tabs button{position:relative;padding-bottom:.2rem}.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--red);transform:scaleX(0);transition:transform .25s}.tabs button.on::after{transform:scaleX(1)}
.btn,.chip,.bar button{transition:transform .15s,background .2s}.btn:active,.chip:active,.bar button:active{transform:scale(.95)}
.bar button.on .i{animation:pop2 .35s}
.card:hover{box-shadow:0 10px 30px #000d}
#modal.on{animation:fade .2s}#player.on{animation:fade .25s}
.skrow{display:flex;gap:.45rem;padding:0 4%;margin-bottom:1.6rem;overflow:hidden}.skel{display:block;flex:none;width:clamp(105px,14vw,190px);aspect-ratio:2/3;border-radius:4px;background:linear-gradient(90deg,#222 25%,#2e2e2e 50%,#222 75%);background-size:200% 100%;animation:shim 1.3s infinite}
#scan.busy .i{animation:spin 1s linear infinite}
.spin{display:inline-block;width:1.1rem;height:1.1rem;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex:none}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + var(--sb));z-index:60;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.toast{background:#262626;border-left:4px solid #888;padding:.6rem 1rem;border-radius:6px;box-shadow:0 6px 20px #000a;animation:toastin .3s;max-width:90vw;transition:opacity .3s}.toast.ok{border-color:#46d369}.toast.er{border-color:var(--red)}.toast.out{opacity:0}
#act{position:fixed;right:1rem;bottom:1rem;z-index:26;display:flex;align-items:center;gap:.6rem;background:#262626;border-radius:2rem;padding:.55rem 1rem;box-shadow:0 6px 20px #000a;animation:toastin .3s}#act[hidden]{display:none}
.steps{display:flex;gap:.6rem;margin:0 0 1.2rem;flex-wrap:wrap}.steps div{flex:1;min-width:8rem;display:flex;align-items:center;gap:.6rem;background:#1f1f1f;border-radius:8px;padding:.6rem .8rem;font-size:.9rem}.steps i{font-style:normal;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;flex:none}
.seg{display:flex;background:#1f1f1f;border-radius:10px;padding:.25rem;margin:0 0 1rem}.seg button{flex:1;padding:.65rem .5rem;border-radius:8px;font-weight:700;color:var(--dim);transition:background .25s,color .25s}.seg button.on{background:#fff;color:#000}
.drop{display:flex;flex-direction:column;align-items:center;gap:.3rem;text-align:center;border:2px dashed #ffffff40;border-radius:12px;padding:2rem 1rem;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}.drop:hover,.drop.over{border-color:var(--red);background:#e5091414}.drop.over{transform:scale(1.015)}.drop .i{width:2.6rem;height:2.6rem;color:var(--red)}.drop span{color:var(--dim);font-size:.9rem}
.opt{margin:1rem 0 .6rem}.opt label{display:block;font-weight:700;margin-bottom:.3rem}.opt small{color:var(--dim)}.opt select{margin-bottom:.3rem}
.fi{background:#1f1f1f;border-radius:8px;padding:.7rem .9rem;margin:.5rem 0;animation:up2 .3s;overflow:hidden}.fi .n{display:flex;justify-content:space-between;gap:.6rem}.fi .n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fi .s{font-size:.8rem;color:var(--dim)}.fi.done .s{color:#46d369}.fi.err .s{color:#ff6b6b}.fi .rm{color:var(--dim)}
.pbar{height:5px;background:#ffffff1f;border-radius:3px;overflow:hidden;margin-top:.4rem}.pbar i{display:block;height:100%;width:0;background:var(--red);border-radius:3px;transition:width .3s}.pbar.ind i{animation:ind 1.4s ease-in-out infinite}
.sub{margin:1.6rem 0 .6rem;font-size:1.2rem}.live{font-size:.8rem;background:var(--red);border-radius:2rem;padding:.05rem .6rem;margin-left:.4rem}.live:empty{display:none}
.job{display:flex;gap:.8rem;align-items:center;background:#1f1f1f;border-radius:8px;padding:.7rem .9rem;margin:.5rem 0;animation:up2 .3s}.job .ji{flex:none;display:grid;place-items:center;width:1.8rem}.job.ok .ji{color:#46d369}.job.er .ji{color:#ff6b6b}.job .t{flex:1;min-width:0}.job .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job .t small{color:var(--dim)}
@media(hover:none){.arrow,.vl{display:none}.card:hover{transform:none;box-shadow:none}.hov{display:none}}
@media(max-width:700px){
 .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chip{flex:none}
 #act{bottom:calc(4.7rem + var(--sb))}#toasts{bottom:calc(5rem + var(--sb))}
 nav{gap:.8rem}.tabs,.sbox input,#scan .lb{display:none}.logo{font-size:1.6rem}.bar{display:flex}
 main{padding-bottom:6rem}
 .hero{height:74vh;justify-content:center;text-align:center;padding:0 6% 14%}
 .hero>div{max-width:none;width:100%}.hero p{-webkit-line-clamp:2;font-size:.95rem}.acts{justify-content:center}.acts .btn{flex:1}
 .row h2{font-size:1.1rem}.card.wide{width:62vw}.grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
 #modal{padding:0;background:var(--panel)}.sheet{border-radius:0;min-height:100%;max-width:none;box-shadow:none}
 .ban{height:64vw;padding:1rem}.body{padding:0 1rem 2rem}
 .pmid{gap:2.2rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav id="nav">
  <span class="logo disp">HOMEFLIX</span>
  <div class="tabs">
    <button class="on" data-v="home">Home</button>
    <button data-v="series">Serie TV</button>
    <button data-v="movie">Film</button>
    <button data-v="explore">Esplora</button>
    <button data-v="list">La mia lista</button>
    <button data-v="add">Aggiungi</button>
  </div>
  <span class="sp"></span>
  <div class="sbox" id="sbox"><button id="sbtn" data-ic="search" aria-label="Cerca"></button><input id="sq" type="search" placeholder="Titoli" aria-label="Cerca"></div>
  <button id="scan" data-ic="refresh" title="Cerca nuovi file nella cartella media"><span class="lb">Aggiorna</span></button>
</nav>
<header class="hero" id="hero" hidden><div>
  <p class="hk" id="hK"></p><h1 class="disp" id="hT"></h1><p id="hP"></p>
  <div class="acts"><button class="btn w" id="hPlay"></button><button class="btn g" id="hInfo">Altre info</button></div>
</div></header>
<main id="main" class="pad"><div class="skrow"><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i></div><div class="skrow"><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i><i class="skel"></i></div></main>
<div class="bar" id="bar">
  <button class="on" data-v="home" data-ic="home"><span>Home</span></button>
  <button data-v="explore" data-ic="grid"><span>Esplora</span></button>
  <button data-v="list" data-ic="list"><span>Lista</span></button>
  <button data-v="add" data-ic="plus"><span>Aggiungi</span></button>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<button id="act" hidden><i class="spin"></i><b></b></button>
<div id="player">
  <video id="vid" playsinline></video>
  <div class="pui">
    <div class="ptop"><button id="back" data-ic="back" aria-label="Indietro"></button><span id="pT"></span></div>
    <div class="pmid"><button id="b10" data-ic="b10" aria-label="Indietro di 10 secondi"></button><button id="pp" aria-label="Play/Pausa"></button><button id="f10" data-ic="f10" aria-label="Avanti di 10 secondi"></button></div>
    <div class="pbot">
      <div class="sk"><span class="tm" id="tc">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione"><span class="tm" id="td">0:00</span></div>
      <div class="pr">
        <div class="vl"><button id="vl" data-ic="vol" aria-label="Audio"></button><input type="range" id="vol" min="0" max="1" step=".05" value="1" aria-label="Volume"></div>
        <div><button id="nx" data-ic="next" hidden>Prossimo episodio</button><button id="fs" data-ic="full" aria-label="Schermo intero"></button></div>
      </div>
    </div>
  </div>
  <span id="sfb"></span>
</div>
<script>
const $ = (s) => document.querySelector(s), $$ = (s) => document.querySelectorAll(s);
const j = (u, o) => fetch(u, o).then((r) => r.json());
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = 'stroke="currentColor" fill="none"';
const IC = {
  play: '<path d="M8 5v14l11-7z"/>', pause: '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>',
  b10: '<path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16" font-size="7" font-weight="700" text-anchor="middle">10</text>',

  full: '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>',

async function showTitle(id, fileId) {

  const lastOpen = last && last.position > 10 && last.position < last.duration - 30;
  const resume = t.files.find((f) => f.id == fileId) || (last && (lastOpen ? last : t.files[t.files.indexOf(last) + 1] || last)) || t.files[0];
  const seasons = [...new Set(t.files.map((f) => f.season))];
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><button class="x" aria-label="Chiudi">${ic('x')}</button>
    <div class="ban"><div><h2 class="disp">${esc(t.name)}</h2>${resume ? `<button class="btn w" id="pl">${ic('play')}${resume.position > 10 ? 'Riprendi' : 'Riproduci'}${tag(resume) ? ' ' + tag(resume) : ''}</button>` : ''}</div></div>
    <div class="body"><p class="meta">${t.year ? `<b>${t.year}</b> · ` : ''}${t.kind === 'series' ? `Serie TV · ${seasons.length} stagion${seasons.length === 1 ? 'e' : 'i'} · ${t.files.length} episodi` : 'Film'}${t.genres ? ' · ' + esc(t.genres.split(',').join(', ')) : ''}</p>
    ${t.overview ? `<p>${esc(t.overview)}</p>` : ''}
    ${t.kind === 'series' ? `<div class="sh"><b>Episodi</b><select id="sel" aria-label="Stagione">${seasons.map((s) => `<option value="${s}">Stagione ${s}</option>`).join('')}</select></div><div id="eps"></div>` : ''}</div></div>`;
  m.querySelector('.ban').style.background = wideBg(t);
  if (t.tmdb_id) { const d = document.createElement('div'); d.className = 'prov'; m.querySelector('.body').append(d); loadProv(t.kind, t.tmdb_id, d); }
  m.querySelector('.x').onclick = pop;
  if (resume) m.querySelector('#pl').onclick = () => play(resume.id);
  if (t.kind === 'series') {
    const sel = $('#sel'), draw = () => $('#eps').replaceChildren(...t.files.filter((f) => f.season == sel.value).map((f) => {
      const b = document.createElement('button'); b.className = 'ep';

function nextEp() {

P.addEventListener('pointerdown', () => { if (!P.classList.contains('idle')) poke(); });
// tocco: mostra/nascondi i controlli; doppio tocco ai lati: ±10 s. Mouse: clic = pausa
v.addEventListener('pointerup', (e) => {
  const now = Date.now(), x = e.clientX / innerWidth;
  if (e.pointerType === 'mouse') { toggle(); return; }
  if (now - lastTap < 320 && (x < 0.35 || x > 0.65)) { skip(x < 0.5 ? -10 : 10); lastTap = 0; return; }
  lastTap = now;
  if (P.classList.contains('idle')) poke(); else P.classList.add('idle');
});
addEventListener('keydown', (e) => {
  if (P.classList.contains('on')) {

    else if (e.key === 'ArrowRight') skip(10);
    else if (e.key === 'ArrowLeft') skip(-10);
    else if (e.key === 'f') $('#fs').click();
    else if (e.key === 'm') v.muted = !v.muted;
    else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); }
    poke();
  } else if (e.key === 'Escape' && $('#modal').classList.contains('on')) pop();
});

let jobList = []; const seen = {};

function toast(msg, kind = '') {
  const d = document.createElement('div'); d.className = 'toast ' + kind; d.textContent = msg; $('#toasts').append(d);
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 300); }, 3500);
}
async function refreshData() { try { [titles, cont] = await Promise.all([j('/api/titles'), j('/api/continue')]); cont = uniqCont(cont); } catch {} }
const isActive = (x) => x.status !== 'completato' && x.status !== 'errore';
function updatePill() {
  const n = jobList.filter(isActive).length;
  $('#act').hidden = !n || view === 'add';
  $('#act b').textContent = n === 1 ? '1 attività in corso' : `${n} attività in corso`;
}
async function watchJobs() {
  try { jobList = await j('/api/jobs'); } catch { return; }
  let fresh = false;
  for (const x of jobList) {
    const was = seen[x.id]; seen[x.id] = x.status;
    if (was && was !== x.status) {
      if (x.status === 'completato') { toast(`“${x.label}” è ora in libreria`, 'ok'); fresh = true; }
      else if (x.status === 'errore') toast(`Non riuscito: ${x.label}`, 'er');
    }
  }
  if (fresh) refreshData();
  updatePill();
  if (onJobs) onJobs(jobList);
}
$('#act').onclick = () => setView('add');
setInterval(watchJobs, 2500); watchJobs();

function drawJobs(js) {
  const box = $('#jobs'); if (!box) return;
  const n = js.filter(isActive).length;
  $('#live').textContent = n ? `${n} in corso` : '';
  box.replaceChildren(...(js.length ? js.map((x) => {
    const st = x.status === 'completato' ? 'ok' : x.status === 'errore' ? 'er' : 'run', pc = (/(\d+)%/.exec(x.detail || '') || [])[1];
    const r = document.createElement('div'); r.className = 'job ' + st;
    r.innerHTML = `<span class="ji">${st === 'ok' ? ic('check') : st === 'er' ? ic('x') : '<i class="spin"></i>'}</span>
      <div class="t"><b>${esc(x.label)}</b><small>${esc(x.detail || (st === 'run' ? x.status : 'Completato'))}</small>${st === 'run' ? `<div class="pbar ${pc ? '' : 'ind'}"><i style="width:${pc || 40}%"></i></div>` : ''}</div>
      <span class="st ${st}">${x.status}</span>`;
    return r;
  }) : [Object.assign(document.createElement('p'), { className: 'hint', textContent: 'Nessuna attività: quando aggiungi un video lo vedi qui, passo dopo passo.' })]));
  if (js.some((x) => x.status === 'completato')) box.append(btn('Vai alla libreria', () => setView('home'), 'w'));
}

const up = (f, row, lang) => new Promise((done) => {
  const bar = row.querySelector('.pbar i'), st = row.querySelector('.s');
  const x = new XMLHttpRequest();
  x.open('POST', `/api/upload?lang=${lang}&name=${encodeURIComponent(f.name)}`); x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.upload.onprogress = (e) => { const p = Math.round((e.loaded / e.total) * 100); bar.style.width = p + '%'; st.textContent = `${fmtSize(f.size)} · caricamento ${p}%`; };
  x.onload = () => { const ok = x.status === 200; let m = 'errore'; try { m = JSON.parse(x.responseText).error || m; } catch {}
    row.classList.add(ok ? 'done' : 'err'); bar.style.width = '100%'; st.textContent = ok ? 'Caricato: ora in conversione' : m; done(ok); };
  x.onerror = () => { row.classList.add('err'); st.textContent = 'Errore di rete'; done(false); };
  x.send(f);
});

function paneUpload(pane) {
  const sel = []; let busy = false;
  pane.innerHTML = `<label class="drop" id="drop" tabindex="0">${ic('plus')}<b>Trascina qui i video</b><span>oppure tocca per sceglierli · avi, mkv, mp4, mov e altri formati</span><input id="uf" type="file" multiple hidden></label>
    <div class="opt"><label for="ul">Lingua dell'audio da tenere</label><select id="ul">${LANGS}</select><small>Se un file ha più tracce audio, resta solo questa.</small></div>
    <div id="fl"></div><button class="btn w" id="ub" hidden></button>`;
  const drop = $('#drop'), inp = $('#uf'), list = $('#fl'), go = $('#ub');
  const sync = () => { go.hidden = !sel.length; go.textContent = `Avvia il caricamento (${sel.length} ${sel.length === 1 ? 'file' : 'file'})`; };
  function add(files) {
    for (const f of files) {
      if (!VID_RE.test(f.name)) { toast('Formato non supportato: ' + f.name, 'er'); continue; }
      const row = document.createElement('div'); row.className = 'fi';
      row.innerHTML = `<div class="n"><b>${esc(f.name)}</b><button class="rm" aria-label="Rimuovi">${ic('x')}</button></div><div class="s">${fmtSize(f.size)} · in attesa</div><div class="pbar"><i></i></div>`;
      const item = { f, row };
      row.querySelector('.rm').onclick = () => { if (busy) return; sel.splice(sel.indexOf(item), 1); row.remove(); sync(); };
      sel.push(item); list.append(row);
    }
    sync();
  }
  inp.onchange = () => { add(inp.files); inp.value = ''; };
  drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } };
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => add(e.dataTransfer.files));
  go.onclick = async () => {
    if (busy) return; busy = true; go.disabled = true;
    const queue = sel.splice(0), lang = $('#ul').value; let n = 0;
    for (const it of queue) { it.row.querySelector('.rm').hidden = true; if (await up(it.f, it.row, lang)) { n++; watchJobs(); } }
    busy = false; go.disabled = false; sync();
    if (n) toast(n === 1 ? 'File caricato: lo stiamo convertendo' : `${n} file caricati: li stiamo convertendo`, 'ok');
  };
}

function renderAdd(main) {
  main.innerHTML = `<div class="pg"><h2 class="ph disp">Aggiungi alla libreria</h2>
    <p class="hint">Porta nuovi film e serie in HomeFlix dal tuo dispositivo: al resto pensiamo noi.</p>
    <div class="steps"><div><i>1</i>Scegli i video</div><div><i>2</i>Li convertiamo</div><div><i>3</i>Li trovi in libreria</div></div>
    <div id="pane"></div>
    <h3 class="sub">Attività <span class="live" id="live"></span></h3><div id="jobs"></div></div>`;
  paneUpload($('#pane')); onJobs = drawJobs; drawJobs(jobList);
}

/* --- esplora per genere --- */
const exp = { type: 'all', genre: '' };
const gnames = (t) => (t.genres ? t.genres.split(',') : []);
const chip = (label, on, fn) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.textContent = label; b.onclick = fn; return b; };

function renderExplore(main) {
  main.innerHTML = '<div class="pg wide"><h2 class="ph disp">Esplora per genere</h2><div class="chips" id="c2"></div><div class="chips" id="c3"></div><div id="ex"></div></div>';
  const draw = () => {
    const ex = $('#ex'); ex.replaceChildren(); $('#c2').replaceChildren(); $('#c3').replaceChildren();
    const base = titles.filter((t) => exp.type === 'all' || t.kind === exp.type);
    const genres = [...new Set(base.flatMap(gnames))].sort((a, b) => a.localeCompare(b, 'it'));
    const pool = exp.genre ? base.filter((t) => gnames(t).includes(exp.genre)) : base;
    $('#c2').append(...[['all', 'Tutto'], ['movie', 'Film'], ['series', 'Serie TV']].map(([k, l]) => chip(l, exp.type === k, () => { exp.type = k; exp.genre = ''; draw(); })));
    $('#c3').append(chip('Tutti i generi', !exp.genre, () => { exp.genre = ''; draw(); }), ...genres.map((g) => chip(g, exp.genre === g, () => { exp.genre = g; draw(); })));
    if (pool.length) $('#c2').append(chip('Scegli per me', false, () => openTitle(pool[(Math.random() * pool.length) | 0].id)));
    if (!base.length) ex.innerHTML = '<div class="empty">Nessun titolo in libreria.</div>';
    else if (exp.genre || !genres.length) {
      ex.append(grid(pool));
      if (!genres.length) ex.insertAdjacentHTML('afterbegin', '<p class="hint" style="margin:0 4% 1rem">Per dividere per genere serve la chiave TMDB: impostala nel file .env e premi “Aggiorna”.</p>');
    } else ex.append(...genres.map((g) => row(g, base.filter((t) => gnames(t).includes(g)).map((t) => card(t)))));
  };
  draw();
}
setPP(); load();
</script>
